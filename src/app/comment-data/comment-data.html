<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
      <link rel="stylesheet" href="comment-data.css">
</head>
<body>

<h2 style="text-align: center;"> Comments Data</h2>

<div *ngIf="loading">Loading comments...</div>
<div *ngIf="error" style="color: red;">{{ error }}</div>

<div id="comment-grid" class="comment-grid" *ngIf="!loading && !error">
  <div *ngFor="let comment of comments">
    <strong>{{ comment.name }}</strong> <br>({{ comment.email }}) <br> City: {{ comment.body }}
  </div>
</div>


</body>
</html>
