<div class="container" *ngIf="item">
  <h2>Modify Item Registry</h2>
  <form (ngSubmit)="onUpdate()">
    <div class="form-group">
      <label>Item Name</label>
      <input type="text" [(ngModel)]="item.name" name="name" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="item.description" name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Price ($)</label>
      <input type="number" [(ngModel)]="item.price" name="price" step="0.01">
    </div>
    <button type="submit" class="btn btn-primary">Apply Changes</button>
    <a routerLink="/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
