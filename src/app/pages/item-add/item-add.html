<div class="container">
  <h2>Add New Product</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Item Name</label>
      <input type="text" [(ngModel)]="newItem.name" name="name" required placeholder="Enter item name">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="newItem.description" name="description" rows="3" placeholder="Enter details"></textarea>
    </div>
    <div class="form-group">
      <label>Price ($)</label>
      <input type="number" [(ngModel)]="newItem.price" name="price" step="0.01" min="0">
    </div>
    <button type="submit" class="btn btn-primary">Save Item</button>
    <a routerLink="/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
