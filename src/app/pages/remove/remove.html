<div class="container confirmation-box" *ngIf="item">
  <h2>Confirm Deletion</h2>
  <p>Are you sure you want to permanently delete <strong>{{ item.name }}</strong>?</p>
  <p class="warning-text">This action cannot be undone.</p>

  <div class="actions">

    <button (click)="confirmDelete()" class="btn btn-danger">Yes, Delete Item</button>
    <a routerLink="/" class="btn btn-secondary">No, Keep It</a>
  </div>
</div>
