<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums</title>
      <link rel="stylesheet" href="album-data.css">


</head>
<body>

<h2 style="text-align: center;"> Album Data</h2>

<div *ngIf="loading">Loading albums...</div>
<div *ngIf="error" style="color: red;">{{ error }}</div>

<div class="album-container">
 <ul>
    @for (album of albums; track album.id) {
      <li>
        <strong>ID:</strong> {{ album.id }} - {{ album.title }}
      </li>
    } @empty {
      <li>No albums found.</li>
    }
  </ul>
</div>


</body>
</html>
